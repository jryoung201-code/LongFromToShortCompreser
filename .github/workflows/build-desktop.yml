name: Build Reel Cutter Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop_app/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Download static FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-download
          New-Item -ItemType Directory -Force -Path desktop_app/bin | Out-Null
          $bin = Get-ChildItem -Path ffmpeg-download -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)/bin/ffmpeg.exe" desktop_app/bin/ffmpeg.exe
          Copy-Item "$($bin.FullName)/bin/ffprobe.exe" desktop_app/bin/ffprobe.exe
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ReelCutter --add-binary "desktop_app/bin/ffmpeg.exe;bin" --add-binary "desktop_app/bin/ffprobe.exe;bin" desktop_app/app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ReelCutter-Windows
          path: dist/ReelCutter.exe
