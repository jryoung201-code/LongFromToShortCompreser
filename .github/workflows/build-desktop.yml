name: Build Reel Cutter Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop_app/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ReelCutter desktop_app/app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ReelCutter-Windows
          path: dist/ReelCutter.exe
